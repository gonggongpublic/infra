# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: ko-KR
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  path_filters:
    - "!**/node_modules/**"
    - "!**/build/**"
    - "!**/.next/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        배포 매니페스트와 Helm 값이 대상 환경의 네임스페이스·서비스 계정·Ingress 설정을 사용하는지 확인하세요.
        Vault 접근 권한과 Kubernetes RBAC가 작업에 필요한 범위인지 검토하고, 서명키·시크릿이 저장소·렌더링 결과·CI 로그에 평문으로 남는 변경을 지적하세요.
        PR 검증 워크플로에 배포용 자격 증명이 노출되거나 의도하지 않은 브랜치에서 배포가 실행되는지 확인하세요.
        배포 변경이 readiness probe와 롤백에 미치는 영향을 살피고, QR 검증 성능 테스트를 바꿀 때는 부하 조건과 p95 판정 기준이 명시돼 있는지 확인하세요.
chat:
  auto_reply: true
